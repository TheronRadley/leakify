version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Expo SDK bumps must move together; one PR, not twenty.
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'react-native'
          - 'react-native-*'
          - 'react'
          - 'react-dom'
          - 'jest-expo'
      react-native-ui:
        patterns:
          - '@rn-primitives/*'
      dev-tooling:
        patterns:
          - 'eslint*'
          - 'prettier'
          - 'typescript'
          - 'jest'
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
